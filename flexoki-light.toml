# Flexoki Light for Herdr 0.9.0+
[theme]
auto_switch = false

[theme.custom]
# Cyan is the accent; Flexoki's light appearance uses 600-level colors.
accent = "#24837B"

# bg / bg-2 separate the main canvas from the sidebar without a colored fill.
panel_bg = "#FFFCF0"
sidebar_bg = "#F2F0E5"

# ui marks the focused workspace; ui-3 distinguishes keyboard navigation.
active_row_bg = "#E6E4D9"
selection_bg = "#CECDC3"

# ui / ui-2 are structural grays, not text grays. Herdr also uses surface0
# for dividers, so it must remain distinct from both background surfaces.
surface0 = "#E6E4D9"
surface1 = "#DAD8CE"
# Despite its name, surface_dim draws sidebar divider lines: use ui, not bg-2.
surface_dim = "#E6E4D9"

# Herdr shares overlay0 between readable labels, inactive borders, and the
# focused scrollbar track: base-700 favors legibility over faint decoration.
# It is one step darker than tx-2 to help labels Herdr additionally dims.
# overlay1 uses tx so the thumb and enabled arrows stand apart from the track
# and disabled arrows. These two tokens must not share a color.
overlay0 = "#575653"
overlay1 = "#100F0F"

# tx / base-700 carry primary and secondary information in light mode.
# Keep secondary labels readable rather than using faint interface grays.
text = "#100F0F"
subtext0 = "#575653"

# Use Flexoki's pigment ramps directly rather than opacity-derived accents.
mauve = "#5E409D"
green = "#66800B"
yellow = "#AD8301"
red = "#AF3029"
blue = "#205EA6"
teal = "#24837B"
peach = "#BC5215"
