name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  schedule:
    - cron: "28 19 * * 1" # Mondays at 19:28 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"
      - uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0

  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # macOS ships GNU Make 3.81 and BSD install; Linux has neither.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # mise.toml asks for the latest herdr, and a restored cache keeps
          # the one it was saved with. The default is 30 days; one day matches
          # minimum_release_age in mise.toml.
          cache_max_age_days: 1
      - run: make check
      - name: Smoke-test the install targets
        run: |
          make install install-tui XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          make install install-tui PREFIX=/usr/local DESTDIR="$RUNNER_TEMP/stage"
